<div class="weather-display-container">

  <button (click)="fetchWeatherData()">Update Weather Data</button>

  <!-- Loader while API call is in progress -->
  <div *ngIf="isLoading()" class="loader-container">
    <div class="spinner"></div>
    <p>Loading weather data...</p>
  </div>

  <div *ngIf="weatherDataExists">
    <h2>Weather Data</h2>
    <table class="weather-table">
      <thead>
        <tr>
          <th>Date</th>
          <th>Temperature Max (°C)</th>
          <th>Temperature Min (°C)</th>
          <th>Precipitation (mm)</th>
          <th>Weather Code</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let item of weatherData(); let i = index">
          <td>{{ item.date }}</td>
          <td>{{ item.temperatureMax }}</td>
          <td>{{ item.temperatureMin }}</td>
          <td>{{ item.precipitation }}</td>
          <td>{{ item.weatherCode }}</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
