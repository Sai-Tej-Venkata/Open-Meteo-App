<div class="app-section">
  <h2>Geo Coordinates</h2>
</div>

<div class="geo-coords-section">
  <label>Latitude:</label>
  <div class="geo-coords">
    <input
      type="number"
      [value]="latitude"
      step="0.01"
      (input)="updateLatitude($event.target.value)"
    />
  </div>
</div>

<div class="geo-coords-section">
  <label>Longitude:</label>
  <div class="geo-coords">
    <input
      type="number"
      [value]="longitude"
      step="0.01"
      (input)="updateLongitude($event.target.value)"
    />
  </div>
</div>
